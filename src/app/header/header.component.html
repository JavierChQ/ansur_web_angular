<header [class.menu-open]="menuOpen">
  <img src="assets/logo-header.png" class="logo" alt="logo" />
  <button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Abrir menú de navegación"
  >
    <i class="bx" [class.bx-menu]="!menuOpen" [class.bx-x]="menuOpen"></i>
  </button>
  <div class="nav-overlay" *ngIf="menuOpen" (click)="closeMenu()" aria-hidden="true"></div>
  <nav [class.open]="menuOpen">
    <a routerLink="/inicio" routerLinkActive="active" (click)="navigateAndClose('/inicio')">Inicio</a>
    <a routerLink="/productos" routerLinkActive="active" (click)="navigateAndClose('/productos')">Productos</a>
    <a routerLink="/nosotros" routerLinkActive="active" (click)="navigateAndClose('/nosotros')">Nosotros</a>
    <a routerLink="/contacto" routerLinkActive="active" (click)="navigateAndClose('/contacto')"> Contacto</a>
  </nav>
  <div class="search" >
    <i class="bx bx-search icon_s" (click)="searchProduct()"></i>
    <input 
      type="text" 
      placeholder="Buscar..." 
      class="input__s" 
      autocomplete="on"
      [(ngModel)]="searchTerm" 
      (keyup.enter)="searchProduct()"
    />
  </div>
  
  
  <div class="icons">
    <a [routerLink]="name ? '/mis-pedidos' : '/login'" (click)="closeMenu()">
      <i class="bx bx-user-circle"></i>
      <span class="icon-label">{{ name ? name : 'Cuenta' }}</span>
    </a>
    
    <a *ngIf="name" routerLink="#" (click)="deleteToken(); closeMenu()">
      <i class='bx bx-log-out'></i>
      <span class="icon-label">Salir</span>
    </a>
    
    <a (click)="handleCartClick(); closeMenu()" class="cart-link">
      <i class="bx bx-cart"></i>
      <span class="cart-label">Carrito</span>
      <span *ngIf="cartCount > 0" class="cart-bubble">{{ cartCount }}</span>
    </a>
  </div>
</header>

<div id="myModal" class="modal">
  <div class="modal-content">
    <p id="modal-content">Mensaje del modal</p>
    <span class="close-btn" (click)="closeModal()">&times;</span>
  </div>
</div>


<div id="cartModal" class="modal">
  <div class="modal-content">
    <p id="cart-modal-content">Mensaje del modal del carrito</p>
    <span class="close-btn" (click)="closeCartModal()">&times;</span>
  </div>
</div>
