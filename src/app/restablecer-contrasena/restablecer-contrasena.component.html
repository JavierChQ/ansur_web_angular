<app-header></app-header>
<section class="section section__contacto">
  <div class="container">
    <div class="contact-content">
      <div class="contact-form">
        <h2>Restablecer contraseña</h2>
        <p class="intro-text">
          Elige una nueva contraseña para tu cuenta.
        </p>

        <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert error">
          {{ errorMessage }}
          <button
            *ngIf="!token || errorMessage.includes('expir') || errorMessage.includes('válido')"
            type="button"
            class="link-button"
            (click)="requestNewLink()"
          >
            Solicitar nuevo enlace
          </button>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token && !successMessage">
          <div class="form-group password-group">
            <label for="password">Nueva contraseña</label>
            <div class="password-wrapper">
              <input
                [type]="passwordType"
                id="password"
                formControlName="password"
                placeholder="Mínimo 8 caracteres"
              />
              <i
                class="bx"
                [ngClass]="{
                  'bx-show': passwordType === 'text',
                  'bx-hide': passwordType === 'password'
                }"
                (click)="togglePasswordVisibility('password')"
              ></i>
            </div>
            <small
              *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
              class="error-text"
            >
              Debe tener 8+ caracteres, una mayúscula, una minúscula y un número.
            </small>
          </div>

          <div class="form-group password-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <div class="password-wrapper">
              <input
                [type]="confirmPasswordType"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="Repite tu contraseña"
              />
              <i
                class="bx"
                [ngClass]="{
                  'bx-show': confirmPasswordType === 'text',
                  'bx-hide': confirmPasswordType === 'password'
                }"
                (click)="togglePasswordVisibility('confirm')"
              ></i>
            </div>
          </div>

          <button type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Guardando...' : 'Restablecer contraseña' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
